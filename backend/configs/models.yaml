# =============================================================================
# Configuracion de inferencia: fusion iluminacion (FasterRCNN+ADE20K) + personas (FasterRCNN+COCO)
# =============================================================================
# Todo lo que de otro modo estaria hardcodeado en el codigo (rutas de pesos,
# umbrales de confianza, intervalo de throttling, fuente de video) vive aqui.
#
# LOS DOS detectores son fasterrcnn_resnet50_fpn_v2 (torchvision, dos etapas
# con NMS): el de iluminacion entrenado sobre ADE20K y el de personas sobre
# COCO 2017. El de personas era RT-DETR (Ultralytics) hasta el 2026-09-09; se
# cambio a Faster R-CNN por decision de la investigacion, para que la
# comparacion entre ambas ramas del sistema use la misma arquitectura.
# Son pesados en comparacion con un YOLO convencional, por lo que los DOS se
# re-ejecutan cada N frames via throttling/async en tiempo real (ver
# app/throttled_detector.py), no solo el de iluminacion.

device: "auto"        # auto | cuda | cpu. "auto" detecta CUDA y cae a CPU con aviso si no hay GPU.

# --- Detector de iluminacion (Window / Luminaire) ---------------------------
# Modelo: fasterrcnn_resnet50_fpn_v2 (torchvision), entrenado sobre
# ADE20K_WindowLuminaire (ver ../ModeloDeteccionLamp). Checkpoint de entrega:
# dict con state_dict + class_names + img_size (ver detectors/lighting_detector.py).
# Corrida usada: la TERCERA ("ADE20KOnly_Better", 60/60 epocas, mejor epoca 50).
# Hasta el 2026-09-09 se cargaba la PRIMERA ("ADE20KOnly", 19/50 epocas, mejor
# epoca 4), que es un checkpoint distinto y peor; se corrigio para que coincida
# con el modelo que la investigacion selecciono y documenta.
# Metricas sobre el split de prueba, 1a iteracion -> 3a iteracion:
#   mAP50    0.382 -> 0.388     mAP50-95  0.220 -> 0.223
#   P        0.458 -> 0.497     R         0.436 -> 0.431     FPS  6.1 -> 6.6
lighting_detector:
  weights_path: "weights/lighting/FasterRCNN_ADE20KOnly_Better_best.pth"
  score_threshold: 0.5        # igual al SCORE_THRESHOLD del notebook de entrenamiento
  interval_frames: 15         # en tiempo real: re-ejecutar cada N frames (1 = cada frame, sin throttling)
  async_execution: true       # ejecutar en un hilo aparte para no bloquear el loop de video

# --- Detector de personas ----------------------------------------------------
# Modelo: fasterrcnn_resnet50_fpn_v2 (torchvision), entrenado sobre COCO 2017
# (clase unica "person"), ver ../ModelosDeteccionComp/Proyecto_FasterRCNN_COCO.
# Corrida usada: la TERCERA ("FasterRCNN_COCO copy 3", config
# fasterrcnn_coco_3.yaml); los pesos exportados son los del EMA, no los del
# modelo instantaneo.
# Checkpoint de entrega: dict con model_state_dict + num_classes + imgsz (ver
# detectors/person_detector.py).
# Metricas sobre val2017 completo (5000 imagenes), frente al RT-DETR anterior:
#   Faster R-CNN v3:  mAP50 0.806  mAP50-95 0.543  P 0.627  R 0.823  ~6 FPS
#   RT-DETR (previo): mAP50 0.760  mAP50-95 0.536  P 0.825  R 0.684  ~14 FPS
# El cambio sube el recall (menos personas perdidas) a costa de la precision:
# para SELENE es la direccion conservadora, porque una persona NO detectada es
# lo que produce un aviso de derroche falso.
person_detector:
  weights_path: "weights/person/FasterRCNN_COCO.pth"
  conf_threshold: 0.5          # igual al prediction.conf_threshold del proyecto de origen (fasterrcnn_coco_3.yaml)
  interval_frames: 12          # SUBIDO 5 -> 12: Faster R-CNN (~43M params, 452 GFLOPs a 640px) rinde ~6 FPS
                               # frente a los ~14 del RT-DETR anterior, asi que mantener 5 encolaria
                               # inferencias mas rapido de lo que el hilo puede resolverlas.
  async_execution: true        # ejecutar en un hilo aparte para no bloquear el loop de video

# --- Video / captura en tiempo real -------------------------------------------
video:
  source: 0                   # indice de camara (0 = webcam por defecto) o ruta a archivo de video
  window_name: "Deteccion en tiempo real - Iluminacion y Personas"

# --- Reportes ------------------------------------------------------------------
reports:
  output_dir: "reports/lighting_analysis"   # coincide con el default de lightingAnalyzer
