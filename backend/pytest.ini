[pytest]
# Se corre desde backend/ (`python -m pytest`), que es la misma raiz desde la
# que se lanza uvicorn: asi `import api...`, `import detectors...` y
# `import lightingAnalyzer...` resuelven igual en tests que en produccion.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers
markers =
    lento: toca la API completa (importar api.main arrastra torch: ~15s la primera vez).
