# =============================================================================
# lighting_analysis.yaml
# -----------------------------------------------------------------------------
# Parametros numericos del analisis clasico de iluminacion
# (lightingAnalyzer/brightness.py, windows.py, luminaires.py, indicators.py,
# visualization.py). Se centralizan aqui para que ningun "numero magico" quede
# escrito directamente en el codigo y pueda ajustarse sin modificarlo.
# =============================================================================

# --- Hotspots (luminaires.py) ------------------------------------------------
# Un pixel se considera "hotspot" si su valor en el canal V (HSV, 0-255) supera
# este umbral. 240/255 (~94%) es el criterio habitual en literatura de
# deteccion de sobreexposicion / clipping en imagenes (near-saturation).
hotspot:
  brightness_threshold: 240
  # Area minima (en pixeles) que debe tener una componente conexa de pixeles
  # por encima del umbral para contar como "hotspot" real (filtra ruido de
  # 1-3 px aislados producido por compresion JPEG o ruido de sensor).
  min_area_px: 4
  # Conectividad usada por cv2.connectedComponentsWithStats (4u 8).
  connectivity: 8

# --- Normalizacion de componentes para Natural/Artificial Score -------------
# Cada componente de indicators.py se normaliza a [0, 1] mediante
# min(valor_observado / saturacion, 1.0). La "saturacion" es el valor a partir
# del cual se considera que el componente ya aporta el maximo posible
# (evita que una escena con 10 ventanas puntue infinitamente mas que una con
# 4, que ya es un numero holgado para un interior tipico).
normalization:
  window_count_saturation: 4          # >= 4 ventanas -> componente "windows" = 1.0
  window_area_saturation: 0.35        # >= 35% del area de la imagen en ventanas -> 1.0
  luminaire_count_saturation: 6        # >= 6 luminarias -> componente "luminaires" = 1.0
  luminaire_area_saturation: 0.20      # >= 20% del area de la imagen en luminarias -> 1.0
  hotspot_pct_saturation: 15.0         # >= 15% de pixeles hotspot (promedio ROI) -> 1.0

# --- Histogramas y mapas de calor -------------------------------------------
histogram:
  bins: 256
  range: [0, 256]

heatmap:
  # Colormap perceptualmente uniforme y secuencial (evita "rainbow"/jet, que
  # introduce bandas falsas de contraste no presentes en los datos).
  colormap: inferno

plots:
  dpi: 150

# --- Distribucion de intensidad luminosa (brightness.py) --------------------
# Bandas de brillo (canal V, 0-255) usadas para resumir la distribucion de
# intensidad de la escena en tres categorias interpretables.
intensity_bands:
  dark: [0, 85]
  mid: [85, 170]
  bright: [170, 256]
