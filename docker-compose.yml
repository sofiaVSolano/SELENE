# Levanta TODO el proyecto SELENE: backend (FastAPI + modelos de vision,
# base de datos SQLite incluida) y frontend (Vite dev server). Ver
# README.md, "Levantar todo con Docker" para el paso a paso.
#
#   docker compose up --build
#
# Primer build: tarda varios minutos (instala torch/torchvision/ultralytics
# dentro de la imagen del backend). Builds posteriores usan la cache de capas.
#
# No hay servicio de base de datos aparte: SQLite es un archivo, no un
# servidor. El propio backend crea/actualiza el esquema al arrancar (ver
# `api.db_init.aplicar_schema()`, llamado desde el startup de `main.py`).

services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      # Sobrescribe lo que diga backend/.env: DATABASE_URL ahi apunta a una
      # ruta de Windows (fuera del contenedor) -- aqui la base SQLite vive
      # en el volumen persistente montado abajo. ENERGY_MODEL_DIR tiene el
      # mismo motivo (ruta de Windows fuera del contenedor).
      DATABASE_URL: sqlite:////app/data/selene.db
      CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
      ENERGY_MODEL_DIR: /energy_model
      # Sin esto el contenedor vive en UTC y `datetime.now()` devuelve cinco
      # horas de mas: el PDF salia fechado "04/08/2026 04:56" cuando en
      # Tunja eran las 23:56 del 3. Los instantes que se guardan en la base
      # siguen siendo UTC con tzinfo (ver models._ahora_utc); esto solo
      # arregla la hora LOCAL que se imprime y se muestra.
      TZ: America/Bogota
    volumes:
      - C:\Users\sofia\OneDrive\ConsumoEnergeticoComp\ProyectoPrediccionEnergetica:/energy_model:ro
      # La base SQLite vive en /app/data, NO en /app/database: esa ultima
      # ruta ya trae `schema.sql` horneado en la imagen (ver Dockerfile), y
      # si el volumen persistente se montara ahi encima, lo taparia (un
      # volumen nuevo empieza vacio) dejando a `aplicar_schema()` sin el
      # archivo que tiene que leer.
      #
      # Bind mount (no volumen nombrado): el archivo .db queda en
      # database/data/selene.db, visible desde Windows, para poder abrirlo
      # con DB Browser for SQLite y ver los datos reales sin pasar por
      # `docker exec`. Antes vivia en el volumen nombrado `selene_db_data`
      # (invisible fuera del contenedor); ese volumen quedo intacto como
      # respaldo pero ya no se usa.
      - ./backend/database/data:/app/data
      # Los PDF de reportes (`asistente_reports_dir` en config.py) vivian
      # solo en la capa escribible del contenedor: cada `--build` del backend
      # los borraba de disco sin tocar la fila correspondiente en la base de
      # datos (que si persiste), dejando reportes "fantasma" -- el boton
      # visualizar/descargar fallaba con 404 porque el archivo ya no
      # existia. Con este volumen los PDF sobreviven a cualquier rebuild,
      # igual que la base de datos.
      - selene_reports:/app/reports/asistente
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  selene_reports:
  frontend_node_modules:
