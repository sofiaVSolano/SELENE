# SPA: cualquier ruta que no sea un archivo real cae en index.html (react-router
# / la navegacion del lado del cliente no existe como archivo fisico en dist/).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Los assets que emite Vite llevan el hash del contenido en el nombre
    # (assets/index-a1b2c3.js): si cambia el codigo, cambia la URL. Nunca hay
    # que revalidarlos.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html es el UNICO archivo sin hash, y es el que apunta al bundle
    # nuevo. Sin cabecera explicita el navegador le aplica cache heuristica y
    # sigue sirviendo el HTML viejo -> y con el, los assets viejos: la app
    # entera se queda en la version anterior aunque el contenedor ya tenga el
    # build nuevo. Por eso los cambios "no se reflejan" al volver a entrar.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
