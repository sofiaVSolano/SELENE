# SPA: cualquier ruta que no sea un archivo real cae en index.html (react-router
# / la navegacion del lado del cliente no existe como archivo fisico en dist/).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
